---
# Site Configuration
title: "Kobukai Aikido"
slogan: "Escolas de Aikido"
description: "Associação Kobukai de Aikido - Tradição, disciplina e harmonia"
author: "Kobukai Aikido"
language: "pt-BR"

url: ""
baseurl: ""

# Permalinks
permalink: pretty
markdown: kramdown
highlighter: rouge

# Exclude files from being published
exclude:
  - vendor
  - .sass-cache
  - .jekyll-cache
  - Gemfile
  - Gemfile.lock
  - README.md
  - .gitignore
  - .ruby-version
  - source-material
  - .github

# Defaults
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
